# 微信输入法风格 v3 —— 同文输入法(Trime)主题
# 鸿蒙中粗 / 小写字母 / 微信数字键盘 / 第一版符号键盘 / Shift 白底黑实心 / 候选辅助码
config_version: "3.0"
name: 微信输入法
author: 'codex'

style:
  color_scheme: weixin
  reset_ascii_mode_on_focus_change: true
  keyboard_height: 244
  keyboard_height_land: 200
  key_height: 66
  key_width: 10.0
  horizontal_gap: 5
  vertical_gap: 10
  round_corner: 12
  key_border: 1
  key_text_size: 29
  key_font: font.ttf
  label_text_size: 24
  key_long_text_size: 24
  symbol_text_size: 11
  candidate_text_size: 26
  candidate_font: font.ttf
  candidate_view_height: 42
  candidate_padding: 8
  candidate_corner_radius: 10
  candidate_spacing: 0
  comment_position: overlay
  comment_vertical_bias: 0.0
  candidate_text_vertical_bias: 0.62
  comment_text_size: 11
  comment_height: 5
  keyboard_padding: 9
  keyboard_padding_left: 0
  keyboard_padding_right: 40
  keyboard_padding_bottom: 20
  keyboard_padding_land: 4
  keyboard_padding_land_bottom: 0
  preview_height: 64
  preview_text_size: 40
  preview_offset: -12
  auto_caps: false
  enter_label_mode: 0
  enter_labels:
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: 回车

preedit:
  horizontal_padding: 8
  top_start_radius: 4
  top_end_radius: 4
  foreground:
    font_size: 16

window:
  insets:
    vertical: 4
    horizontal: 4
  item_padding:
    horizontal: 16
  foreground:
    label_font_size: 20
    text_font_size: 20
    comment_font_size: 16

fallback_colors:
  candidate_text_color: text_color

preset_color_schemes:
  weixin:
    name: 微信输入法
    author: codex
    dark_scheme: weixin_dark
    # 候选栏
    back_color: 0xE1E3E8
    candidate_background: 0xE1E3E8
    candidate_text_color: 0x2B2B2B
    comment_text_color: 0x9A9A9A
    label_color: 0x9A9A9A
    hilited_candidate_back_color: 0xFFFFFF
    hilited_candidate_text_color: 0x23C891
    hilited_label_color: 0x23C891
    hilited_comment_text_color: 0x23C891
    # 编码(正在输入的拼音)
    text_color: 0x9A9A9A
    hilited_text_color: 0x2B2B2B
    hilited_back_color: 0xE1E3E8
    text_back_color: 0xE1E3E8
    # 键盘
    keyboard_back_color: 0xDCDEE3
    root_background: 0xDCDEE3
    # 按键背景：白色圆角 + 底部阴影（9-patch）
    key_back_color: keybg.9.png
    key_border_color: 0xEDEEF1
    key_text_color: 0x2B2B2B
    key_symbol_color: 0x9AA0AA
    hilited_key_back_color: 0xD5D7DD
    hilited_key_text_color: 0x1A1A1A
    hilited_key_symbol_color: 0xB0B2B8
    off_key_back_color: 0xB7BCC4
    off_key_border_color: 0xB9BCC6
    off_key_text_color: 0x2B2B2B
    off_key_symbol_color: 0x2B2B2B
    hilited_off_key_back_color: 0xA6AAB6
    hilited_off_key_text_color: 0x2B2B2B
    # Shift 激活（on 状态）：白底黑实心箭头
    on_key_back_color: keybg.9.png
    on_key_text_color: 0x1A1A1A
    on_key_symbol_color: 0x83909F
    hilited_on_key_back_color: 0xF0F1F3
    space_back_color: 0xFFFFFF
    hilited_space_back_color: 0xD5D7DD
    enter_back_color: 0x1A1A1A
    enter_text_color: 0xFFFFFF
    enter_symbol_color: 0xFFFFFF
    hilited_enter_back_color: 0x000000
    preview_back_color: 0xFFFFFF
    preview_text_color: 0x2B2B2B
    shadow_color: 0x00000000
    # 键级样式字段（供 styl/* 与按键引用，深浅色自动切换）
    function_key_bg: keybg_gray.9.png
    function_key_bg_pressed: 0xA6AAB6
    function_key_text: 0x1A1A1A
    function_key_text_pressed: 0x1A1A1A
    green_key_bg: keybg_green.9.png
    green_key_bg_pressed: 0x1FB584
    green_key_text: 0xFFFFFF
    plain_key_bg_pressed: 0xD5D7DD
    shift_arrow_color: 0x7A828C
    num_hint_color: 0x5F6B73
    sym_page_selected: 0xC9CDD4
  weixin_dark:
    name: 微信输入法·深色
    author: codex
    # 候选栏
    back_color: 0x202020
    candidate_background: 0x202020
    candidate_text_color: 0xE8E8E8
    comment_text_color: 0x8F8F8F
    label_color: 0x8F8F8F
    hilited_candidate_back_color: 0x3A3A3C
    hilited_candidate_text_color: 0x23C891
    hilited_label_color: 0x23C891
    hilited_comment_text_color: 0x23C891
    # 编码（正在输入的拼音）
    text_color: 0x8F8F8F
    hilited_text_color: 0xE8E8E8
    hilited_back_color: 0x202020
    text_back_color: 0x202020
    # 键盘背景
    keyboard_back_color: 0x202020
    root_background: 0x202020
    # 按键：深灰圆角 + 暗色底部阴影（9-patch）
    key_back_color: keybg_dark.9.png
    key_border_color: 0x202020
    key_text_color: 0xECECEC
    key_symbol_color: 0x8F8F8F
    hilited_key_back_color: 0x6E6E6E
    hilited_key_text_color: 0xFFFFFF
    hilited_key_symbol_color: 0xA8A8AC
    off_key_back_color: 0x414141
    off_key_border_color: 0x414141
    off_key_text_color: 0xECECEC
    off_key_symbol_color: 0xECECEC
    hilited_off_key_back_color: 0x555555
    hilited_off_key_text_color: 0xFFFFFF
    # Shift 激活（on 状态）：浅底深箭头
    on_key_back_color: 0xE8E8E8
    on_key_text_color: 0x1A1A1A
    on_key_symbol_color: 0x83909F
    hilited_on_key_back_color: 0xD5D7DD
    space_back_color: 0x5F5F5F
    hilited_space_back_color: 0x6E6E6E
    enter_back_color: 0x23C891
    enter_text_color: 0xFFFFFF
    enter_symbol_color: 0xFFFFFF
    hilited_enter_back_color: 0x1FB584
    preview_back_color: 0x3A3A3C
    preview_text_color: 0xE8E8E8
    shadow_color: 0x00000000
    # 键级样式字段（供 styl/* 与按键引用）
    function_key_bg: keybg_gray_dark.9.png
    function_key_bg_pressed: 0x4E4E4E
    function_key_text: 0xECECEC
    function_key_text_pressed: 0xFFFFFF
    green_key_bg: keybg_green_dark.9.png
    green_key_bg_pressed: 0x1FB584
    green_key_text: 0xFFFFFF
    plain_key_bg_pressed: 0x3A3A3C
    shift_arrow_color: 0xECECEC
    num_hint_color: 0xD0D0D0
    sym_page_selected: 0x4A4A4E

styl:
  bigicon:
    key_text_size: 36
    key_back_color: function_key_bg
    hilited_key_back_color: function_key_bg_pressed
    key_text_color: function_key_text
    hilited_key_text_color: function_key_text_pressed
  green:
    key_back_color: green_key_bg
    hilited_key_back_color: green_key_bg_pressed
    key_text_color: green_key_text
    hilited_key_text_color: green_key_text
  dark:
    key_back_color: 0x1A1A1A
    hilited_key_back_color: 0x000000
    key_text_color: 0xFFFFFF
    hilited_key_text_color: 0xFFFFFF
  voicetext:
    key_text_color: 0x9A9A9A
    key_text_size: 14
  gray:
    key_back_color: function_key_bg
    hilited_key_back_color: function_key_bg_pressed
    key_text_color: function_key_text
    hilited_key_text_color: function_key_text_pressed
  plain:
    key_back_color: 0x00000000
    hilited_key_back_color: plain_key_bg_pressed

preset_keys:
  Shift_L: { label: 'ic@arrow_up_bold', send: Shift_L, shift_lock: ascii_long }
  BackSpace: { label: '⌫', repeatable: true, send: BackSpace }
  Return: { label: enter_labels, send: Return }
  Return1: { label: 回车, send: Return }
  Return_ok: { label: '确定', send: Return }
  space: { label: ' ', repeatable: false, functional: false, send: space }
  space1: { label: 空格, repeatable: false, functional: false, send: space }
  select_all: { label: 全选, functional: false, send: Control+a }
  cut: { label: 剪切, functional: false, send: Control+x }
  copy: { label: 复制, functional: false, send: Control+c }
  paste: { label: 粘贴, functional: false, send: Control+v }
  Mode_switch: { toggle: ascii_mode, send: SWITCH_CHARSET, states: [中/英, 英/中] }
  Keyboard_symbols: { label: 符号, send: Eisu_toggle, select: symbols }
  SwitchSymbols: { label: '', send: FUNCTION, command: switch_hide_key_symbol }
  Keyboard_cmdsym: { label: '⌘', send: Eisu_toggle, select: symbols }
  Keyboard_backarrow: { label: '←', send: Eisu_toggle, select: .default }
  Sym_close: { label: '×', send: Eisu_toggle, select: .default }
  Sym_page_recent: { label: 'ic@clock_outline', send: Eisu_toggle, select: symbols_recent }
  Sym_page_cn: { label: '中', send: Eisu_toggle, select: symbols }
  Sym_page_en: { label: '英', send: Eisu_toggle, select: symbols_en }
  Sym_page_quote: { label: '《》', send: Eisu_toggle, select: symbols_quote }
  Sym_page_curr: { label: '$¥€', send: Eisu_toggle, select: symbols_curr }
  Sym_page_math: { label: '+-×÷', send: Eisu_toggle, select: symbols_math }
  Sym_page_num: { label: '≡', send: Eisu_toggle, select: symbols_num }
  Sym_history: { label: 'ic@clock_outline', send: Eisu_toggle, select: symbols }
  Sym_zh: { label: '中', send: Eisu_toggle, select: symbols }
  Sym_en: { label: '英', send: Eisu_toggle, select: symbols }
  Sym_quote: { label: '《》', send: Eisu_toggle, select: symbols }
  Sym_curr: { label: '$¥€', send: Eisu_toggle, select: symbols }
  Sym_math: { label: '½±', send: Eisu_toggle, select: symbols }
  Sym_num: { label: '一二', send: Eisu_toggle, select: symbols }
  Sym_pinyin: { label: 'à', send: Eisu_toggle, select: symbols }
  Sym_kana: { label: 'あ', send: Eisu_toggle, select: symbols }
  Sym_greek: { label: 'Ω', send: Eisu_toggle, select: symbols }
  Keyboard_number: { label: 123, send: Eisu_toggle, select: number }
  Keyboard_letter: { label: ABC, send: Eisu_toggle, select: default }
  Keyboard_default: { label: 返回, send: Eisu_toggle, select: .default }
  Keyboard_mini: {label: 迷你, send: Eisu_toggle, select: mini}
  Keyboard_switch: {label: 鍵盤, send: Eisu_toggle, select: .next}
  liquid_keyboard_switch: { label: 更多, send: FUNCTION, command: liquid_keyboard, option: "更多" }
  clipboard_window: { label: "剪贴", send: FUNCTION, command: "clipboard_window", option: '0' } #0剪贴板，1收藏夹
  Menu: { label: 方案, send: MENU }
  liquid_keyboard_emoji: { label: '☺', send: FUNCTION, command: liquid_keyboard, option: "更多" }
  liquid_keyboard_exit: { label: 返回, send: FUNCTION, command: liquid_keyboard, option: "-1" }
  Return2: { label: 回车, send: Return }
  Hide: { label: '▼', send: BACK }
  Escape: { label: Esc, send: Escape }
  Tab: { label: Tab, send: Tab }

liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "tumuyan"
  row: 6              #每屏最多显示多少行按键
  row_land: 5         #横屏每屏最多显示多少行按键
  key_height: 40      #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: 60    #single类型的按键宽度
  vertical_gap: 1     #纵向按键间隙
  margin_x: 5         #左右按键间隙的1/2
  fixed_key_bar:  # 固定按键条
    position: bottom  # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys:  # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - space1
      - BackSpace
      - Return2
      - clipboard_window
      - liquid_keyboard_switch
  keyboards: [emoji, math, ascii, cn, history, symbollist, list, ids, symbol, tabs, pinyin, script_symbols, jp, grease, rusa, korea, lation, yinbiao, unit, yanwenzi, combing, emoji_full]  #tab列表
  tabs:
    name: 更多
    type: TABS
  history:
    name: 常用
    type: HISTORY
  emoji:
    type: SINGLE
    keys: "🙂😂🤣😆🙃😅🥺😎👀🙈🙉🙊☹😑😄🤐😨😱🌚🌝🤔❤💔🌹💣👌👍😣😥😮🙄😏😕😯😪😫😴😌🤑😉😋😎😍😘😚😛😜😝😒😓😔😲😷🤒😇🤓🤗🤕🙁😖😞😟😤😢😭😦😧😨😩😬😰😳😵😡😠☝✌🖕👎🙏🤘👏💪💋☘🍀🌸☕🍵🍺🍻🍦🍬🍚🍜🍲🍖🎂💤"
  emoji_full:
